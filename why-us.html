<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iLink - Software & IT Services</title>
<style>
    * {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
background-color: #050716; /* Dark background matching image */
color: #ffffff;
overflow-x: hidden;
}

/* Header & Navigation */
.navbar-container {
width: 100%;
padding: 24px 60px;
background-color: #050716;
}

.navbar {
display: flex;
justify-content: space-between;
align-items: center;
max-width: 1400px;
margin: 0 auto;
}

/* Logo Styling */
.logo {
font-size: 28px;
font-weight: 700;
color: #ffffff;
text-decoration: none;
letter-spacing: -0.5px;
}

.logo-i {
color: #4378ff;
}

/* Navigation Links */
.nav-links {
display: flex;
list-style: none;
gap: 32px;
}

.nav-link {
position: relative;
text-decoration: none;
color: #a0a5b5;
font-size: 15px;
font-weight: 500;
transition: color 0.3s ease;
padding-bottom: 6px;
}

.nav-link:hover, .nav-link.active {
color: #ffffff;
}

.nav-link.active::after {
content: '';
position: absolute;
bottom: 0;
left: 0;
width: 100%;
height: 2px;
background-color: #4378ff;
border-radius: 2px;
}

/* Get in Touch Button */
.btn-touch {
display: inline-flex;
align-items: center;
justify-content: center;
gap: 8px;
padding: 8px 18px;
border-radius: 9999px; /* Perfect pill shape */
border: 1px solid rgba(255, 255, 255, 0.18);
background: rgba(255, 255, 255, 0.03);
backdrop-filter: blur(8px);
-webkit-backdrop-filter: blur(8px);
color: #ffffff;
font-size: 13px;
font-weight: 400;
text-decoration: none;
line-height: 1;
white-space: nowrap;
transition: all 0.25s ease;
}

.btn-touch .arrow {
font-size: 13px;
color: rgba(255, 255, 255, 0.6);
display: inline-block;
transition: transform 0.2s ease, color 0.2s ease;
}

.btn-touch:hover {
border-color: rgba(67, 120, 255, 0.6);
background: rgba(67, 120, 255, 0.1);
box-shadow: 0 0 12px rgba(67, 120, 255, 0.25);
}

.btn-touch:hover .arrow {
color: #ffffff;
transform: translate(2px, -2px);
}

</style>
</head>
<body>
<header class="navbar-container">
<nav class="navbar">
<a href="#" class="logo"><span class="logo-i">i</span>link</a>
<ul class="nav-links">
<li><a href="index.html" class="nav-link active">Home</a></li>
<li><a href="about.html" class="nav-link">About Us</a></li>
<li><a href="services.html" class="nav-link">Services</a></li>
<li><a href="why-us.html" class="nav-link active">Why Choose ilink</a></li>
<li><a href="contact.html" class="nav-link">Contact</a></li>
</ul>
<a href="#" class="btn-touch">
Get in Touch <span class="arrow">↗</span>
</a>
</nav>
</header>
</body>
</html>
